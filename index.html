<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delvira Nails Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Header / Navbar -->
    <nav class="bg-pink-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold"><i class="fas font-sparkles mr-2"></i>Delvira Nails Manager</h1>
        <span class="text-sm bg-pink-700 px-3 py-1 rounded-full">Kelola Price List</span>
    </nav>

    <div class="max-w-4xl mx-auto p-4 md:p-6">
        
        <!-- Form Tambah / Edit Layanan -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 id="form-title" class="text-lg font-bold text-pink-600 mb-4 flex items-center gap-2">
                <i class="fas fa-plus-circle"></i> Tambah Layanan Baru
            </h2>
            <form id="price-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="hidden" id="service-index" value="-1">
                
                <div>
                    <label class="block text-sm font-semibold mb-1">Nama Layanan / Treatment</label>
                    <input type="text" id="service-name" placeholder="Contoh: Gel Polish Hand" required 
                        class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-pink-500 focus:outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold mb-1">Harga (Rp)</label>
                    <input type="number" id="service-price" placeholder="Contoh: 50000" required 
                        class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-pink-500 focus:outline-none">
                </div>

                <div class="flex items-end gap-2">
                    <button type="submit" id="btn-submit" 
                        class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-2.5 px-4 rounded-lg transition duration-200 shadow">
                        <i class="fas fa-save mr-1"></i> Simpan
                    </button>
                    <button type="button" id="btn-cancel" onclick="resetForm()" 
                        class="hidden w-full bg-gray-400 hover:bg-gray-500 text-white font-bold py-2.5 px-4 rounded-lg transition duration-200">
                        Batal
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabel Price List -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="p-4 bg-pink-50 border-b border-pink-100 flex justify-between items-center">
                <h3 class="font-bold text-gray-700 text-lg">Daftar Harga & Layanan</h3>
                <span id="total-services" class="text-xs bg-pink-200 text-pink-800 px-2 py-1 rounded-full font-semibold">0 Layanan</span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                            <th class="p-3">No</th>
                            <th class="p-3">Nama Layanan</th>
                            <th class="p-3">Harga</th>
                            <th class="p-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="price-list-table">
                        <!-- Data Layanan Akan Muncul Di Sini -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Script JavaScript untuk Operasi Tambah, Edit, Hapus -->
    <script>
        // Data Awal Default Price List Delvira Nails
        const defaultServices = [
            { name: "Manicure Express", price: 35000 },
            { name: "Gel Polish Hand", price: 50000 },
            { name: "Nail Art Basic / Finger", price: 5000 },
            { name: "Nail Extension Express", price: 100000 },
            { name: "Remove Gel Polish", price: 20000 }
        ];

        // Ambil data dari LocalStorage atau pakai default jika belum ada
        let services = JSON.parse(localStorage.getItem('delvira_services')) || defaultServices;

        const priceForm = document.getElementById('price-form');
        const serviceNameInput = document.getElementById('service-name');
        const servicePriceInput = document.getElementById('service-price');
        const serviceIndexInput = document.getElementById('service-index');
        const priceListTable = document.getElementById('price-list-table');
        const formTitle = document.getElementById('form-title');
        const btnSubmit = document.getElementById('btn-submit');
        const btnCancel = document.getElementById('btn-cancel');
        const totalServices = document.getElementById('total-services');

        // Fungsi menampilkan data ke tabel
        function renderTable() {
            priceListTable.innerHTML = '';
            
            if (services.length === 0) {
                priceListTable.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center p-6 text-gray-400">Belum ada layanan. Silakan tambah layanan di atas.</td>
                    </tr>`;
                totalServices.innerText = "0 Layanan";
                return;
            }

            services.forEach((service, index) => {
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-pink-50/50 transition";
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-gray-500">${index + 1}</td>
                    <td class="p-3 font-medium text-gray-800">${service.name}</td>
                    <td class="p-3 font-bold text-pink-600">Rp ${Number(service.price).toLocaleString('id-ID')}</td>
                    <td class="p-3 text-center space-x-2">
                        <button onclick="editService(${index})" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1 rounded text-sm transition">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button onclick="deleteService(${index})" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition">
                            <i class="fas fa-trash"></i> Hapus
                        </button>
                    </td>
                `;
                priceListTable.appendChild(tr);
            });

            totalServices.innerText = `${services.length} Layanan`;
            // Simpan ke LocalStorage browser
            localStorage.setItem('delvira_services', JSON.stringify(services));
        }

        // Simpan Data (Tambah atau Update)
        priceForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = serviceNameInput.value.trim();
            const price = parseFloat(servicePriceInput.value);
            const index = parseInt(serviceIndexInput.value);

            if (!name || isNaN(price)) return;

            if (index === -1) {
                // Tambah Layanan Baru
                services.push({ name, price });
            } else {
                // Update Layanan
                services[index] = { name, price };
            }

            resetForm();
            renderTable();
        });

        // Edit Layanan
        function editService(index) {
            serviceNameInput.value = services[index].name;
            servicePriceInput.value = services[index].price;
            serviceIndexInput.value = index;

            formTitle.innerHTML = `<i class="fas fa-edit"></i> Edit Layanan`;
            btnSubmit.innerHTML = `<i class="fas fa-check"></i> Update`;
            btnSubmit.className = "w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 px-4 rounded-lg transition duration-200 shadow";
            btnCancel.classList.remove('hidden');
        }

        // Hapus Layanan
        function deleteService(index) {
            if (confirm(`Apakah Anda yakin ingin menghapus "${services[index].name}"?`)) {
                services.splice(index, 1);
                renderTable();
            }
        }

        // Reset Form ke Tampilan Tambah
        function resetForm() {
            serviceNameInput.value = '';
            servicePriceInput.value = '';
            serviceIndexInput.value = '-1';

            formTitle.innerHTML = `<i class="fas fa-plus-circle"></i> Tambah Layanan Baru`;
            btnSubmit.innerHTML = `<i class="fas fa-save mr-1"></i> Simpan`;
            btnSubmit.className = "w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-2.5 px-4 rounded-lg transition duration-200 shadow";
            btnCancel.classList.add('hidden');
        }

        // Jalankan fungsi pertama kali saat halaman dimuat
        renderTable();
    </script>

</body>
</html>
